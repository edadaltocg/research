[project]
name = "research"
version = "0.1.0"
description = "Ed's from-zero research monorepo. For AI learning purposes."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "datasets",
  "safetensors",
  "einops",
  "fire",
  "matplotlib",
  "psutil",
  "seaborn",
  "tiktoken",
  "torcheval",
  "pydantic",
  "torchinfo>=1.8.0",
]
[project.optional-dependencies]
docs = [
  "mkdocs-material>=9.5.47",
  "mkdocs>=1.6.0",
  "mkdocstrings>=0.27.0",
  "mkdocstrings-python>=1.12.2",
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-section-index>=0.3.9",
]
vision = [
    "albumentations>=2.0.4",
    "opencv-python>=4.11.0.86",
    "timm>=1.0.14",
]
trainer = [
    "tensorboard>=2.19.0",
    "torch-tb-profiler>=0.4.3",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "ruff",
  "mypy",
  "pysnooper",
  "research[docs,vision,trainer]",
]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "research"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
skip_empty = true

[tool.uv.workspace]
members = ["projects/*"]
