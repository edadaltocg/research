[project]
name = "research"
version = "0.1.0"
description = "Ed's From-Zero research monorepo. For AI learning purposes."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "datasets>=3.1.0,<4.0.0",
  "safetensors>=0.4.5,<1.0.0",
  "einops>=0.8.0,<1.0.0",
  "fire>=0.7.0,<1.0.0",
  "matplotlib>=3.9.3,<4.0.0",
  "psutil>=6.1.0,<7.0.0",
  "seaborn>=0.13.2,<1.0.0",
  "tiktoken>=0.8.0,<1.0.0",
  "torcheval>=0.0.7,<1.0.0",
  "pydantic>=2.10.4,<3.0.0",
  "torchinfo>=1.8.0,<2.0.0",
  "torch>=2.2.0,<3.0.0",
  "torchvision>=0.17.0,<1.0.0",
  "torchaudio>=2.2.0,<3.0.0",
  "jax>=0.10.1",
  "transformers>=5.12.1",
  "sentencepiece>=0.2.1",
  "scikit-learn>=1.9.0",
  "plotly>=6.9.0",
  "dash>=4.4.0",
]
[project.optional-dependencies]
docs = [
  "mkdocs-material>=9.5.47,<10.0.0",
  "properdocs>=1.6.7,<2.0.0",
  "mkdocstrings>=0.27.0,<1.0.0",
  "mkdocstrings-python>=1.12.2,<2.0.0",
  "mkdocs-gen-files>=0.5.0,<1.0.0",
  "mkdocs-section-index>=0.3.9,<1.0.0",
  "mkdocs-shadcn",
]
vision = [
    "albumentations>=2.0.4,<3.0.0",
    "opencv-python>=4.11.0.86,<5.0.0",
    "timm>=1.0.14,<2.0.0",
]
trainer = [
    "tensorboard>=2.19.0,<3.0.0",
    "torch-tb-profiler>=0.4.3,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "pytest-xdist>=3.6.1,<4.0.0",
  "ruff>=0.8.2,<1.0.0",
  "ty",
  "pysnooper>=1.2.3,<2.0.0",
  "research[docs,vision,trainer]",
]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "research"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
skip_empty = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = ["projects/*"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
unresolved-import = "ignore"
possibly-unresolved-reference = "ignore"
missing-type-argument = "error"
