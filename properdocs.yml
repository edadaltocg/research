site_name: From Zero Docs
site_url: https://edadaltocg.com/from-zero/docs
# repo_url: https://github.com/edadaltocg/research
theme:
  name: shadcn
  katex_options: {}

plugins:
  - search
  - excalidraw
  - mkdocstrings
  - autorefs

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
