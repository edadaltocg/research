line-length = 120
target-version = "py312"

[lint]
select = [
  "YTT",  # flake8-2020
  "S",    # flake8-bandit
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "T10",  # flake8-debugger
  "SIM",  # flake8-simplify
  "I",    # isort
  "C90",  # mccabe
  "E",    # pycodestyle
  "W",    # pycodestyle
  "F",    # pyflakes
  "PGH",  # pygrep-hooks
  "UP",   # pyupgrade
  "RUF",  # ruff
  "TRY",  # tryceratops
]

ignore = [
  "E501",  # Line too long (AI research code frequently has long inline layers/tensors/configs/URLs)
  "E731",  # Do not assign lambda expression (lambdas are common/clean in data pipelines/transforms)
  "E741",  # Ambiguous variable name (capital X, Y, H, W, etc. are standard mathematical notation)
  "B904",  # Within an except clause, raise exceptions with raise ... from err
  "S101",  # Assert statements are standard for checking tensor shapes and types in deep learning research
  "TRY003", # Long exception messages are common and helpful in research scripts
  "C901",  # Function/method too complex (ML layers and trainers are inherently complex and stateful)
  "A001",  # Shadowing builtin names like compile or id (extremely common in PyTorch ecosystem)
  "A002",  # Argument shadowing builtin names like input (standard for model forward signatures)
  "S105",  # Hardcoded password check false positive on tokenizer keywords containing "token"
  "SIM108", # Enforcing ternary operators (multi-line if-else blocks are more readable in model files)
  "RUF059", # Unused unpacked variables (common when unpacking shapes: b, c, h, w = x.shape)
  "B026",  # Star-arg unpacking after keyword argument
  "B027",  # Abstract base class method without abstract decorator
  "PGH003", # Specific type ignore codes (plain `# type: ignore` is much easier and standard)
  "RUF002", # Ambiguous characters in docstrings (like EN dash in references)
]

[lint.per-file-ignores]
"tests/*" = ["S101"]  # S101: assert statements are required for tests
"projects/**" = ["F821", "S108", "S311", "SIM115"]  # Suppress sandbox-specific draft code warnings in projects
"tutorials/**" = ["B020", "A002", "S311", "SIM115"]  # Suppress loose style and random generator warnings in tutorials

[format]
quote-style = "double"
preview = true
